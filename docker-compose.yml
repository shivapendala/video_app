version: '3.8'

services:
  # 1. PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: videoplatform_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: videoplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videoplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videoplatform_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: videoplatform
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_SSL: "false"
      JWT_SECRET: super_secure_video_platform_jwt_secret_key_2026
      JWT_REFRESH_SECRET: super_secure_video_platform_refresh_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Flutter Web Frontend Service (Nginx)
  frontend:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    container_name: videoplatform_frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
